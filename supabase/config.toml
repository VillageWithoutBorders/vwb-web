
[functions.send-push-notification]
enabled = true
verify_jwt = false
import_map = "./functions/send-push-notification/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-push-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-push-notification/*.html" ]

[functions.archive-group-messages]
enabled = true
# Called by a Supabase cron job, not by a signed-in member. It checks its
# own secret header (ARCHIVE_CRON_SECRET) instead.
verify_jwt = false
entrypoint = "./functions/archive-group-messages/index.ts"

[functions.calendar-feed]
enabled = true
verify_jwt = false
entrypoint = "./functions/calendar-feed/index.ts"

[functions.csp-report]
enabled = true
# Browsers send "this would be blocked" reports without signing in. It keeps
# no personal details and writes only through log_csp_reports().
verify_jwt = false
entrypoint = "./functions/csp-report/index.ts"

[functions.cleanup-event-photos]
enabled = true
# Called by a Supabase cron job every night (vwb-event-entrance-photos.sql), not
# by a signed-in member. It checks the x-push-secret header instead.
verify_jwt = false
entrypoint = "./functions/cleanup-event-photos/index.ts"
