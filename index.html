<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/vwb_favicon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <script>
      // Appearance (Settings): apply light or dark before anything draws.
      (function () {
        try {
          var t = localStorage.getItem('vwb_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var light = t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6efdc');
          // Simple view (bigger words and buttons), saved on the account and on this phone.
          // The printed setup card's QR code opens /?simple=1: start this phone in Simple view.
          if (/[?&]simple=1\b/.test(location.search)) localStorage.setItem('vwb_simple', '1');
          if (localStorage.getItem('vwb_simple') === '1') document.documentElement.classList.add('simple');
          // Text size, picked in Settings (Oct 27).
          var ts = localStorage.getItem('vwb_text');
          if (ts === 'large' || ts === 'larger') document.documentElement.classList.add('text-' + ts);
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
    <title>Village Without Borders</title>
    <meta name="description" content="A free app where neighbors ask for help, offer help, and find local events. No fees. No algorithm. Just connection." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Village Without Borders" />
    <meta property="og:title" content="Free yourself from the algorithm" />
    <meta property="og:description" content="A free app where neighbors ask for help, offer help, and find local events. No fees. No algorithm. Just connection." />
    <meta property="og:image" content="https://app.villagewithoutborders.org/images/vwb_share_card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Village Without Borders logo. Neighbors helping neighbors." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free yourself from the algorithm" />
    <meta name="twitter:description" content="A free app where neighbors ask for help, offer help, and find local events. No fees. No algorithm. Just connection." />
    <meta name="twitter:image" content="https://app.villagewithoutborders.org/images/vwb_share_card.png" />
    <style>
      /* Opening splash: Jade's animated logo (portrait video, updated Oct 25).
         Lives here (not in React) so it shows the instant the page opens,
         before the app's JavaScript has even downloaded. The background
         matches the video's own dark teal, so the video's edges disappear
         on any screen shape. */
      #vwb-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0b1516;
        transition: opacity 0.45s ease;
        cursor: pointer;
      }
      #vwb-splash.vwb-splash-hide { opacity: 0; pointer-events: none; }
      #vwb-splash video, #vwb-splash img {
        width: 100%; height: 100%; max-width: 100%;
        object-fit: contain; display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        #vwb-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="vwb-splash" role="img" aria-label="Village Without Borders. Building community, one neighbor at a time.">
      <video id="vwb-splash-video" muted playsinline preload="auto" poster="/splash/vwb-splash-v4-start.webp" width="720" height="1280" aria-hidden="true">
        <source src="/splash/vwb-splash-v4.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      // Plays once per visit (a fresh open of the installed app counts as a
      // new visit). Tap anywhere to skip. If the video can't play for any
      // reason, or takes too long, the splash just gets out of the way.
      (function () {
        var el = document.getElementById('vwb-splash')
        var video = document.getElementById('vwb-splash-video')
        var done = false
        function hide() {
          if (done) return
          done = true
          el.classList.add('vwb-splash-hide')
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el) }, 500)
        }
        var seen = false
        try { seen = sessionStorage.getItem('vwb_splash_seen') === '1'; sessionStorage.setItem('vwb_splash_seen', '1') } catch (e) {}
        // Never inside the website's calendar window, or when opened in a frame.
        var embedded = window.self !== window.top || location.pathname.indexOf('/calendar/embed') === 0
        if (seen || embedded) { el.parentNode.removeChild(el); return }
        el.addEventListener('click', hide)
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (reduce) {
          // No animation: show the finished logo briefly instead.
          var img = new Image()
          img.src = '/splash/vwb-splash-v4-end.webp'
          img.alt = ''
          img.width = 720
          img.height = 1280
          video.parentNode.replaceChild(img, video)
          setTimeout(hide, 1800)
          return
        }
        video.addEventListener('ended', function () { setTimeout(hide, 350) })
        // Only the last source failing means nothing can play (the browser
        // quietly moves on to the next source when an earlier one fails).
        var sources = video.getElementsByTagName('source')
        sources[sources.length - 1].addEventListener('error', hide)
        setTimeout(hide, 7000)
        var p = video.play()
        if (p && p.catch) p.catch(hide)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
