# Automatic tests on every push and pull request. See tests/README.md.
# They use a pretend database, so nothing here can reach or change the real VWB.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: Unit and functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  e2e:
    name: Whole-app tests (phone and computer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # When a test fails, keep the screenshots and step-by-step recordings to look at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: whole-app-test-results
          path: test-results/
          retention-days: 7
