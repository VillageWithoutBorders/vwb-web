name: Something isn't working
description: Tell us about a problem in the app.
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Please don't include anyone's address, phone number, or private messages.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you trying to do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: The steps you took, one per line. Screenshots help too.
  - type: input
    id: device
    attributes:
      label: Phone or computer
      description: For example, "Android phone, Chrome" or "iPhone, Safari". Add any helper tools, like a screen reader.
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Spanish
